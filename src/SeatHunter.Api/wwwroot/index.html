<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Hunter - Modern SaaS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }, 
                        success: { 400: '#34d399', 500: '#10b981', 600: '#059669' }, 
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { 
            background-color: #020617; /* slate-950 */
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }
        
        /* Premium Ambient Background */
        .bg-ambient-1 {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(2, 6, 23, 0) 70%);
            top: -200px; left: -100px; filter: blur(60px);
            animation: drift1 20s infinite alternate ease-in-out;
            pointer-events: none; z-index: 0;
        }
        .bg-ambient-2 {
            position: fixed; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, rgba(2, 6, 23, 0) 70%);
            bottom: -150px; right: -100px; filter: blur(60px);
            animation: drift2 25s infinite alternate ease-in-out;
            pointer-events: none; z-index: 0;
        }
        @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(120px, 80px); } }
        @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-100px, -60px); } }

        /* Micro-animations */
        .animate-row-enter { animation: rowEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes rowEnter { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .toast-enter { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { 
            from { transform: translateX(100%) scale(0.95); opacity: 0; } 
            to { transform: translateX(0) scale(1); opacity: 1; } 
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const locales = {
            TR: {
                loginSubtitle: "Hedef biletlerinizi yakalamak için giriş yapın.", name: "Ad", surname: "Soyad", email: "E-posta", password: "Şifre", loginBtn: "Giriş Yap", registerBtn: "Kayıt Ol", noAccount: "Hesabınız yok mu? ", hasAccount: "Zaten hesabınız var mı? ", profile: "Profilim", logout: "Çıkış Yap", newSearch: "Yeni Arama Başlat", targetUrl: "Hedef Bilet URL'si", startScan: "Taramayı Başlat", starting: "Başlatılıyor...", activeScans: "Aktif Taramalar", route: "ROTA", listening: "Sistem Dinlemede", platform: "Platform", routeId: "URL / Rota", start: "Başlangıç", status: "Durum", cancelled: "İptal Edildi", found: "Bulundu", goTicket: "Bilete Git", scanning: "Taranıyor", cancel: "İptal Et", profileSettings: "Profil ve Ayarlar", history: "Arama Geçmişim", changePass: "Şifre Değiştir", deleteAccount: "Hesabı Sil", noHistory: "Geçmişte yapılmış bir aramanız bulunmuyor.", currentPass: "Mevcut Şifreniz", newPass: "Yeni Şifreniz", updatePass: "Şifreyi Güncelle", dangerZone: "Tehlikeli Bölge", deleteWarn: "Hesabınızı sildiğinizde, aktif aramalarınız, arama geçmişiniz ve tüm kişisel verileriniz kalıcı olarak sistemden silinir. Bu işlem geri alınamaz.", deleteConfirmBtn: "Hesabımı Kalıcı Olarak Sil", loginSuccess: "Giriş Başarılı", loginSuccessMsg: "Başarıyla giriş yapıldı.", regSuccess: "Kayıt Başarılı", regSuccessMsg: "Kayıt başarılı! Lütfen giriş yapın.", error: "Hata", loginFailed: "Giriş başarısız.", connError: "Bağlantı Hatası", connFailed: "Sunucuya bağlanılamadı.", success: "Başarılı", opFailed: "İşlem başarısız.", delConfirmTitle: "Emin misiniz?", delConfirmMsg: "Hesabınızı ve tüm arama geçmişinizi kalıcı olarak silmek istediğinize emin misiniz? Bu işlem geri alınamaz.", yesDelete: "Evet, Sil", cancelBtn: "İptal", accDeleted: "Hesabınız başarıyla silindi.", seatFound: "Koltuk Bulundu!", cancelledMsg: "Arama durduruldu.", authError: "Yetki Hatası", noSession: "Geçerli bir oturum bulunamadı.", rateLimit: "Rate Limit", tooManyReq: "Çok fazla istek attınız, lütfen bekleyin.", langEn: "EN", langTr: "TR", hintUrl: "Bilet satın almak istediğiniz sayfanın tam linkini yapıştırın (Biletix, Obilet veya herhangi bir yabancı site).", eventNamePlaceholder: "Etkinlik Adı (Opsiyonel)"
            },
            EN: {
                loginSubtitle: "Login to hunt your target tickets.", name: "Name", surname: "Surname", email: "Email", password: "Password", loginBtn: "Login", registerBtn: "Register", noAccount: "Don't have an account? ", hasAccount: "Already have an account? ", profile: "My Profile", logout: "Logout", newSearch: "Start New Hunt", targetUrl: "Target Ticket URL", startScan: "Start Scan", starting: "Starting...", activeScans: "Active Hunts", route: "ROUTE", listening: "System Listening", platform: "Platform", routeId: "URL / Route", start: "Start", status: "Status", cancelled: "Cancelled", found: "Found", goTicket: "Go to Ticket", scanning: "Scanning", cancel: "Cancel", profileSettings: "Profile & Settings", history: "Hunt History", changePass: "Change Password", deleteAccount: "Delete Account", noHistory: "You don't have any past hunts.", currentPass: "Current Password", newPass: "New Password", updatePass: "Update Password", dangerZone: "Danger Zone", deleteWarn: "When you delete your account, your active hunts, history, and all personal data will be permanently deleted. This action cannot be undone.", deleteConfirmBtn: "Permanently Delete My Account", loginSuccess: "Login Successful", loginSuccessMsg: "Successfully logged in.", regSuccess: "Registration Successful", regSuccessMsg: "Registered successfully! Please log in.", error: "Error", loginFailed: "Login failed.", connError: "Connection Error", connFailed: "Could not connect to the server.", success: "Success", opFailed: "Operation failed.", delConfirmTitle: "Are you sure?", delConfirmMsg: "Are you sure you want to permanently delete your account and all history? This action cannot be undone.", yesDelete: "Yes, Delete", cancelBtn: "Cancel", accDeleted: "Your account has been successfully deleted.", seatFound: "Seat Found!", cancelledMsg: "Hunt stopped.", authError: "Auth Error", noSession: "No valid session found.", rateLimit: "Rate Limit", tooManyReq: "Too many requests, please wait.", langEn: "EN", langTr: "TR", hintUrl: "Paste the full link of the page you want to buy tickets from (Biletix, Obilet, or any foreign site).", eventNamePlaceholder: "Event Name (Optional)"
            }
        };

        function App() {
            const [lang, setLang] = useState(localStorage.getItem('lang') || 'TR');
            const t = (key) => locales[lang][key] || key;

            const toggleLang = () => {
                const newLang = lang === 'TR' ? 'EN' : 'TR';
                setLang(newLang);
                localStorage.setItem('lang', newLang);
                document.documentElement.lang = newLang.toLowerCase();
            };

            const [token, setToken] = useState(localStorage.getItem('token') || null);
            const [urlInput, setUrlInput] = useState("");
            const [eventNameInput, setEventNameInput] = useState("");
            const [activeHunts, setActiveHunts] = useState([]);
            const [toasts, setToasts] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [authMode, setAuthMode] = useState("login");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [firstName, setFirstName] = useState("");
            const [lastName, setLastName] = useState("");
            const [authError, setAuthError] = useState("");

            const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
            const [profileTab, setProfileTab] = useState("history"); // history, password, delete
            const [historyHunts, setHistoryHunts] = useState([]);
            const [oldPassword, setOldPassword] = useState("");
            const [newPassword, setNewPassword] = useState("");

            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError("");
                
                const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/register";
                const payload = authMode === "login" 
                    ? { email, password } 
                    : { email, password, firstName, lastName };

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        if (authMode === "login") {
                            setToken(data.token);
                            localStorage.setItem('token', data.token);
                            const newToast = { id: Date.now(), title: t('loginSuccess'), message: t('loginSuccessMsg'), type: "success" };
                            setToasts(prev => [...prev, newToast]);
                            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                        } else {
                            setAuthMode("login");
                            const newToast = { id: Date.now(), title: t('regSuccess'), message: t('regSuccessMsg'), type: "success" };
                            setToasts(prev => [...prev, newToast]);
                            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                        }
                    } else {
                        setAuthError(data.message || t('loginFailed'));
                        const newToast = { id: Date.now(), title: t('error'), message: data.message || t('loginFailed'), type: "error" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    }
                } catch (err) {
                    setAuthError(t('connFailed'));
                    const newToast = { id: Date.now(), title: t('connError'), message: t('connFailed'), type: "error" };
                    setToasts(prev => [...prev, newToast]);
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                }
            };

            const logout = () => {
                setToken(null);
                localStorage.removeItem('token');
                setActiveHunts([]);
                setIsProfileModalOpen(false);
            };

            const fetchHistory = async () => {
                try {
                    const res = await fetch('/api/hunts/history', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (res.ok) {
                        const data = await res.json();
                        setHistoryHunts(data);
                    }
                } catch (e) {
                    console.error("Geçmiş alınamadı:", e);
                }
            };

            useEffect(() => {
                if (isProfileModalOpen && profileTab === "history") {
                    fetchHistory();
                }
            }, [isProfileModalOpen, profileTab]);

            const handleChangePassword = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/user/change-password', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        const newToast = { id: Date.now(), title: t('success'), message: data.message, type: "success" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                        setOldPassword("");
                        setNewPassword("");
                    } else {
                        const newToast = { id: Date.now(), title: t('error'), message: data.message || t('opFailed'), type: "error" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleDeleteAccount = async () => {
                setShowDeleteConfirm(false);
                try {
                    const res = await fetch('/api/user/account', {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const newToast = { id: Date.now(), title: t('success'), message: t('accDeleted'), type: "success" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                        setTimeout(logout, 1500);
                    } else {
                        const data = await res.json();
                        const newToast = { id: Date.now(), title: t('error'), message: data.message || t('opFailed'), type: "error" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                if (!token) return;
                
                const connection = new signalR.HubConnectionBuilder()
                    .withUrl("/notificationHub")
                    .withAutomaticReconnect()
                    .build();

                connection.on("SeatFound", (data) => {
                    const newToast = { id: Date.now(), title: t('seatFound'), message: data.message, routeId: data.requestId, type: "success" };
                    setToasts(prev => [...prev, newToast]);
                    
                    setActiveHunts(prev => prev.map(hunt => 
                        hunt.id === data.requestId ? { ...hunt, status: "Found" } : hunt
                    ));
                    
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                });

                connection.start().catch(err => console.error("SignalR Error", err));
                return () => connection.stop();
            }, [token, lang]);

            useEffect(() => {
                if (!token) return;
                fetch('/api/hunts/active', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.status === 401) logout();
                    return res.json();
                })
                .then(data => {
                    if (Array.isArray(data)) setActiveHunts(data);
                })
                .catch(err => console.error("Aktif aramalar alınamadı:", err));
            }, [token]);

            const handleCancel = async (huntId) => {
                try {
                    const res = await fetch(`/api/hunts/cancel/${huntId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        setActiveHunts(prev => prev.map(hunt => hunt.id === huntId ? { ...hunt, status: "Cancelled" } : hunt));
                        const newToast = { id: Date.now(), title: t('cancelled'), message: t('cancelledMsg'), routeId: huntId, type: "info" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    }
                } catch (e) {
                    console.error("İptal hatası:", e);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!urlInput.trim() || !token) return;

                setIsSubmitting(true);
                const reqPayload = {
                    userId: "admin",
                    url: urlInput.trim(), 
                    targetDate: new Date().toISOString(),
                    language: lang.toLowerCase(),
                    targetEventName: eventNameInput.trim() || null
                };

                try {
                    const res = await fetch('/api/HuntRequests', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(reqPayload)
                    });

                    if (res.status === 401) {
                        const newToast = { id: Date.now(), title: t('authError'), message: t('noSession'), type: "error" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    } else if (res.status === 429) {
                        const newToast = { id: Date.now(), title: t('rateLimit'), message: t('tooManyReq'), type: "error" };
                        setToasts(prev => [...prev, newToast]);
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== newToast.id)), 7000);
                    } else if (res.ok) {
                        const data = await res.json();
                        
                        let derivedProvider = "Universal";
                        if (urlInput.toLowerCase().includes("biletix.com")) derivedProvider = "Biletix";
                        else if (urlInput.toLowerCase().includes("obilet.com")) derivedProvider = "Obilet";

                        setActiveHunts(prev => [{
                            id: data.huntRequestId || Date.now(),
                            provider: derivedProvider,
                            eventId: reqPayload.url,
                            eventName: reqPayload.targetEventName,
                            status: "Active",
                            startTime: new Date().toLocaleTimeString(lang === 'TR' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit' })
                        }, ...prev]);
                        setUrlInput("");
                        setEventNameInput("");
                    }
                } catch (e) {
                    console.error("Arama başlatılamadı:", e);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const langToggleBtn = (
                <button onClick={toggleLang} className="text-slate-300 hover:text-white transition-colors text-sm font-medium flex items-center gap-2 bg-white/[0.05] hover:bg-white/[0.1] px-3 py-1.5 rounded-lg border border-white/[0.05]">
                    <i className="fa-solid fa-globe"></i> {lang === 'TR' ? 'EN' : 'TR'}
                </button>
            );

            if (!token) {
                return (
                    <div className="min-h-screen relative flex items-center justify-center bg-slate-950 p-6">
                        <div className="bg-ambient-1"></div>
                        <div className="bg-ambient-2"></div>
                        
                        <div className="absolute top-8 right-8 z-20">
                            {langToggleBtn}
                        </div>

                        <div className="bg-slate-900/40 border border-white/[0.04] rounded-2xl p-8 max-w-md w-full backdrop-blur-md shadow-2xl relative z-10">
                            <div className="text-center mb-8">
                                <i className="fa-solid fa-crosshairs text-brand-500 text-4xl mb-4 drop-shadow-[0_0_8px_rgba(99,102,241,0.5)]"></i>
                                <h1 className="text-2xl font-bold tracking-tight text-white/90">SeatHunter</h1>
                                <p className="text-slate-400 mt-2 text-sm">{t('loginSubtitle')}</p>
                            </div>
                            
                            <form onSubmit={handleAuth} className="space-y-4">
                                {authError && <div className="p-3 rounded-lg bg-rose-500/10 text-rose-500 text-sm font-medium border border-rose-500/20">{authError}</div>}
                                
                                {authMode === "register" && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="text" placeholder={t('name')} value={firstName} onChange={e => setFirstName(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 transition-all text-sm" />
                                        <input type="text" placeholder={t('surname')} value={lastName} onChange={e => setLastName(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 transition-all text-sm" />
                                    </div>
                                )}
                                
                                <div>
                                    <input type="email" placeholder={t('email')} value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 transition-all text-sm" />
                                </div>
                                <div>
                                    <input type="password" placeholder={t('password')} value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 transition-all text-sm" />
                                </div>
                                
                                <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl px-4 py-3 transition-all duration-300 mt-2 shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:shadow-[0_0_25px_rgba(99,102,241,0.5)]">
                                    {authMode === "login" ? t('loginBtn') : t('registerBtn')}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center text-sm text-slate-400">
                                {authMode === "login" ? t('noAccount') : t('hasAccount')}
                                <button onClick={() => setAuthMode(authMode === "login" ? "register" : "login")} className="text-brand-400 hover:text-brand-300 font-medium transition-colors">
                                    {authMode === "login" ? t('registerBtn') : t('loginBtn')}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    {/* Ambient Backgrounds */}
                    <div className="bg-ambient-1"></div>
                    <div className="bg-ambient-2"></div>

                    {/* Header */}
                    <header className="relative z-10 border-b border-white/[0.04] bg-slate-950/40 backdrop-blur-xl px-8 py-5 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-3 group cursor-pointer">
                            <i className="fa-solid fa-crosshairs text-brand-500 text-2xl drop-shadow-[0_0_8px_rgba(99,102,241,0.5)] group-hover:rotate-90 transition-transform duration-700 ease-out"></i>
                            <h1 className="text-xl font-bold tracking-tight text-white/90">
                                Seat<span className="text-white/40 font-medium">Hunter</span>
                            </h1>
                        </div>
                        <div className="flex items-center gap-4">
                            {langToggleBtn}
                            <button onClick={() => setIsProfileModalOpen(true)} className="text-slate-300 hover:text-white transition-colors text-sm font-medium flex items-center gap-2 bg-white/[0.05] hover:bg-white/[0.1] px-3 py-1.5 rounded-lg border border-white/[0.05]">
                                <i className="fa-solid fa-user"></i> {t('profile')}
                            </button>
                            <button onClick={logout} className="text-slate-400 hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
                                <i className="fa-solid fa-right-from-bracket"></i> {t('logout')}
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow p-6 lg:p-10 relative z-10">
                        <div className="max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
                            
                            {/* Sol Panel - Form */}
                            <div className="lg:col-span-4">
                                <div className="bg-slate-900/40 border border-white/[0.04] rounded-2xl p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-white/[0.08]">
                                    <h2 className="text-sm font-semibold text-white/80 mb-6 tracking-wide">
                                        {t('newSearch')}
                                    </h2>
                                    <form onSubmit={handleSubmit} className="space-y-6">
                                        <div>
                                            <label className="block text-[11px] font-semibold tracking-widest text-slate-500 uppercase mb-2">{t('targetUrl')}</label>
                                            <input 
                                                type="url" 
                                                value={urlInput}
                                                onChange={(e) => setUrlInput(e.target.value)}
                                                placeholder="https://..."
                                                className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 focus:ring-brand-500/50 transition-all placeholder-slate-700 text-sm hover:border-white/[0.12]"
                                            />
                                            <p className="mt-3 text-[10px] text-slate-500/80 leading-relaxed normal-case tracking-normal">
                                                {t('hintUrl')}
                                            </p>
                                        </div>

                                        <div>
                                            <input 
                                                type="text" 
                                                value={eventNameInput}
                                                onChange={(e) => setEventNameInput(e.target.value)}
                                                placeholder={t('eventNamePlaceholder')}
                                                className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 focus:ring-brand-500/50 transition-all placeholder-slate-700 text-sm hover:border-white/[0.12]"
                                            />
                                        </div>

                                        <button 
                                            type="submit" 
                                            disabled={!urlInput || !token || isSubmitting}
                                            className="w-full bg-white/10 hover:bg-brand-500 text-white font-medium rounded-xl px-4 py-3.5 transition-all duration-300 disabled:opacity-30 disabled:cursor-not-allowed mt-4 flex justify-center items-center gap-2 text-sm border border-white/5 hover:border-brand-400 hover:shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                                            {isSubmitting ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-bolt"></i>}
                                            {isSubmitting ? t('starting') : t('startScan')}
                                        </button>
                                    </form>
                                </div>
                            </div>

                            {/* Sağ Panel - Tablo */}
                            <div className="lg:col-span-8">
                                <div className="bg-slate-900/20 border border-white/[0.03] rounded-2xl overflow-hidden backdrop-blur-md flex flex-col h-full min-h-[450px]">
                                    <div className="px-7 py-5 border-b border-white/[0.03] flex justify-between items-center">
                                        <h2 className="text-sm font-semibold text-white/80 tracking-wide">
                                            {t('activeScans')}
                                        </h2>
                                        {activeHunts.length > 0 && (
                                            <span className="text-[10px] font-medium text-slate-500 tracking-widest uppercase">
                                                {activeHunts.length} {t('route')}
                                            </span>
                                        )}
                                    </div>
                                    
                                    <div className="flex-grow overflow-x-auto relative">
                                        {activeHunts.length === 0 ? (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500/50 transition-opacity duration-1000">
                                                <div className="relative flex items-center justify-center mb-6">
                                                    <div className="absolute w-20 h-20 border-2 border-indigo-500/20 rounded-full animate-ping"></div>
                                                    <div className="absolute w-12 h-12 border-2 border-indigo-500/40 rounded-full animate-pulse"></div>
                                                    <div className="relative w-4 h-4 bg-indigo-500/80 rounded-full shadow-[0_0_15px_rgba(99,102,241,0.6)]"></div>
                                                </div>
                                                <p className="text-xs tracking-widest uppercase font-semibold text-slate-400">{t('listening')}</p>
                                            </div>
                                        ) : (
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-white/[0.02] text-[10px] uppercase tracking-widest text-slate-500">
                                                        <th className="px-7 py-4 font-semibold">{t('platform')}</th>
                                                        <th className="px-7 py-4 font-semibold">{t('routeId')}</th>
                                                        <th className="px-7 py-4 font-semibold">{t('start')}</th>
                                                        <th className="px-7 py-4 font-semibold text-right">{t('status')}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/[0.02]">
                                                    {activeHunts.map((hunt, idx) => (
                                                        <tr key={hunt.id} className="animate-row-enter hover:bg-white/[0.02] transition-colors duration-300 group cursor-default">
                                                            <td className="px-7 py-4 whitespace-nowrap text-sm text-slate-400">
                                                                <div className="flex items-center gap-3">
                                                                    <div className="w-6 h-6 rounded-md bg-white/[0.03] border border-white/[0.05] flex items-center justify-center text-[10px] group-hover:border-white/[0.1] transition-colors">
                                                                        <i className="fa-solid fa-ticket text-slate-500"></i>
                                                                    </div>
                                                                    <span className="font-medium">{hunt.provider === "BiletixLive" || hunt.provider === "Biletix" ? "Biletix" : (hunt.provider === "ObiletLive" || hunt.provider === "Obilet" ? "Obilet" : "Universal")}</span>
                                                                </div>
                                                            </td>
                                                            <td className="px-7 py-4 whitespace-nowrap text-sm font-semibold text-slate-200 tracking-wider group-hover:text-white transition-colors">
                                                                <div className="truncate max-w-[150px] inline-block align-bottom" title={hunt.eventId}>
                                                                    {hunt.eventName || hunt.eventId}
                                                                </div>
                                                            </td>
                                                            <td className="px-7 py-4 whitespace-nowrap text-sm text-slate-500 font-medium">
                                                                {hunt.startTime}
                                                            </td>
                                                            <td className="px-7 py-4 whitespace-nowrap text-right">
                                                                <div className="flex items-center justify-end gap-4">
                                                                    {hunt.status === "Cancelled" ? (
                                                                        <span className="inline-flex items-center gap-2 text-xs font-semibold text-slate-500">
                                                                            <span className="relative flex h-1.5 w-1.5">
                                                                                <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-slate-500"></span>
                                                                            </span>
                                                                            {t('cancelled')}
                                                                        </span>
                                                                    ) : hunt.status === "Found" ? (
                                                                        <React.Fragment>
                                                                            <span className="inline-flex items-center gap-2 text-xs font-semibold text-success-500">
                                                                                <span className="relative flex h-1.5 w-1.5">
                                                                                    <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-success-500"></span>
                                                                                </span>
                                                                                {t('found')}
                                                                            </span>
                                                                            <a href={hunt.eventId} target="_blank" rel="noopener noreferrer" className="bg-success-500/10 hover:bg-success-500/20 text-success-500 border border-success-500/20 px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-[0_0_10px_rgba(16,185,129,0.1)] hover:shadow-[0_0_15px_rgba(16,185,129,0.25)] flex items-center gap-2 hover:scale-105 active:scale-95">
                                                                                {t('goTicket')} <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                                            </a>
                                                                        </React.Fragment>
                                                                    ) : (
                                                                        <React.Fragment>
                                                                            <span className="inline-flex items-center gap-2 text-xs font-medium text-brand-400/90 group-hover:text-brand-400 transition-colors">
                                                                                <span className="relative flex h-1.5 w-1.5">
                                                                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                                                                                    <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-brand-500"></span>
                                                                                </span>
                                                                                {t('scanning')}
                                                                            </span>
                                                                            <button onClick={() => handleCancel(hunt.id)} title={t('cancel')} className="ml-3 w-6 h-6 rounded-md bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white transition-colors flex items-center justify-center group-hover:opacity-100 opacity-50">
                                                                                <i className="fa-solid fa-xmark text-xs"></i>
                                                                            </button>
                                                                        </React.Fragment>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Profil Modalı */}
                    {isProfileModalOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={() => setIsProfileModalOpen(false)}></div>
                            <div className="bg-slate-900 border border-white/[0.08] rounded-2xl w-full max-w-2xl shadow-2xl relative z-10 flex flex-col max-h-[85vh] overflow-hidden">
                                <div className="px-6 py-4 border-b border-white/[0.05] flex justify-between items-center bg-slate-900/50">
                                    <h2 className="text-lg font-semibold text-white/90 flex items-center gap-2">
                                        <i className="fa-solid fa-user-circle text-brand-500"></i> {t('profileSettings')}
                                    </h2>
                                    <button onClick={() => setIsProfileModalOpen(false)} className="text-slate-400 hover:text-white transition-colors">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                
                                <div className="flex border-b border-white/[0.05] bg-slate-900/30">
                                    <button onClick={() => setProfileTab("history")} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${profileTab === 'history' ? 'border-brand-500 text-brand-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>{t('history')}</button>
                                    <button onClick={() => setProfileTab("password")} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${profileTab === 'password' ? 'border-brand-500 text-brand-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>{t('changePass')}</button>
                                    <button onClick={() => setProfileTab("delete")} className={`flex-1 py-3 text-sm font-medium transition-colors border-b-2 ${profileTab === 'delete' ? 'border-rose-500 text-rose-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>{t('deleteAccount')}</button>
                                </div>

                                <div className="p-6 overflow-y-auto">
                                    {profileTab === "history" && (
                                        <div>
                                            {historyHunts.length === 0 ? (
                                                <div className="text-center py-10 text-slate-500">{t('noHistory')}</div>
                                            ) : (
                                                <div className="space-y-3">
                                                    {historyHunts.map(h => (
                                                        <div key={h.id} className="bg-slate-950/50 border border-white/[0.04] p-4 rounded-xl flex items-center justify-between">
                                                            <div>
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <span className="text-xs font-semibold px-2 py-0.5 rounded bg-white/[0.05] text-slate-300">{h.provider === "BiletixLive" || h.provider === "Biletix" ? "Biletix" : (h.provider === "ObiletLive" || h.provider === "Obilet" ? "Obilet" : "Universal")}</span>
                                                                    <span className="text-sm font-bold text-white/90 max-w-[200px] truncate block" title={h.eventId}>{h.eventName || h.eventId}</span>
                                                                </div>
                                                                <div className="text-xs text-slate-500"><i className="fa-regular fa-clock"></i> {h.date}</div>
                                                            </div>
                                                            <div>
                                                                {h.status === "Found" ? (
                                                                    <span className="inline-flex items-center gap-1.5 text-xs font-bold text-success-500 bg-success-500/10 px-2.5 py-1 rounded-md border border-success-500/20">
                                                                        <i className="fa-solid fa-check"></i> {t('found')}
                                                                    </span>
                                                                ) : (
                                                                    <span className="inline-flex items-center gap-1.5 text-xs font-bold text-slate-400 bg-slate-500/10 px-2.5 py-1 rounded-md border border-slate-500/20">
                                                                        <i className="fa-solid fa-ban"></i> {t('cancelled')}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {profileTab === "password" && (
                                        <form onSubmit={handleChangePassword} className="space-y-4 max-w-sm mx-auto py-4">
                                            <div>
                                                <label className="block text-[11px] font-semibold tracking-widest text-slate-500 uppercase mb-2">{t('currentPass')}</label>
                                                <input type="password" value={oldPassword} onChange={e => setOldPassword(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold tracking-widest text-slate-500 uppercase mb-2">{t('newPass')}</label>
                                                <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} required className="w-full bg-slate-950/50 border border-white/[0.06] text-slate-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 text-sm" />
                                            </div>
                                            <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl px-4 py-3 transition-all mt-4">
                                                {t('updatePass')}
                                            </button>
                                        </form>
                                    )}

                                    {profileTab === "delete" && (
                                        <div className="text-center py-6 max-w-sm mx-auto">
                                            <div className="w-16 h-16 mx-auto bg-rose-500/10 border border-rose-500/20 rounded-full flex items-center justify-center mb-4">
                                                <i className="fa-solid fa-triangle-exclamation text-rose-500 text-2xl"></i>
                                            </div>
                                            <h3 className="text-lg font-bold text-white/90 mb-2">{t('dangerZone')}</h3>
                                            <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                                                {t('deleteWarn')}
                                            </p>
                                            <button onClick={() => setShowDeleteConfirm(true)} className="w-full bg-rose-600/20 hover:bg-rose-600 border border-rose-600/50 text-rose-500 hover:text-white font-medium rounded-xl px-4 py-3 transition-all">
                                                {t('deleteConfirmBtn')}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Delete Confirmation Modal */}
                    {showDeleteConfirm && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-md" onClick={() => setShowDeleteConfirm(false)}></div>
                            <div className="bg-slate-900 border border-rose-500/20 rounded-2xl w-full max-w-sm shadow-2xl relative z-10 flex flex-col overflow-hidden animate-row-enter">
                                <div className="p-6 text-center">
                                    <div className="w-12 h-12 mx-auto bg-rose-500/20 rounded-full flex items-center justify-center mb-4">
                                        <i className="fa-solid fa-exclamation text-rose-500 text-xl"></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-white/90 mb-2">{t('delConfirmTitle')}</h3>
                                    <p className="text-sm text-slate-400 mb-6">{t('delConfirmMsg')}</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 py-2.5 rounded-xl border border-white/[0.06] text-slate-300 hover:bg-white/[0.05] transition-all font-medium text-sm">
                                            {t('cancelBtn')}
                                        </button>
                                        <button onClick={handleDeleteAccount} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white shadow-[0_0_15px_rgba(244,63,94,0.3)] transition-all font-medium text-sm">
                                            {t('yesDelete')}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Bildirimleri */}
                    <div className="fixed bottom-8 right-8 z-[80] flex flex-col gap-4 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast-enter pointer-events-auto flex items-start gap-4 bg-slate-900/90 backdrop-blur-xl border p-4 rounded-2xl w-80 max-w-[calc(100vw-3rem)] transition-all ${
                                t.type === 'error' 
                                    ? 'border-rose-500/30 shadow-[0_10px_40px_-10px_rgba(243,64,84,0.3)]' 
                                    : t.type === 'info'
                                        ? 'border-brand-500/30 shadow-[0_10px_40px_-10px_rgba(99,102,241,0.3)]'
                                        : 'border-success-500/30 shadow-[0_10px_40px_-10px_rgba(16,185,129,0.3)]'
                            }`}>
                                <div className={`mt-1 w-8 h-8 rounded-full flex items-center justify-center shrink-0 border ${
                                    t.type === 'error'
                                        ? 'bg-rose-500/20 border-rose-500/20'
                                        : t.type === 'info'
                                            ? 'bg-brand-500/20 border-brand-500/20'
                                            : 'bg-success-500/20 border-success-500/20'
                                }`}>
                                    <i className={`fa-solid ${
                                        t.type === 'error' ? 'fa-xmark text-rose-500' : t.type === 'info' ? 'fa-info text-brand-500' : 'fa-check text-success-500'
                                    } text-xs`}></i>
                                </div>
                                <div className="flex-1 pt-0.5">
                                    <h3 className="text-sm font-semibold text-white/90">{t.title}</h3>
                                    <p className="text-[13px] text-slate-400 mt-1 leading-relaxed font-medium">{t.message}</p>
                                </div>
                                <button onClick={() => setToasts(prev => prev.filter(x => x.id !== t.id))} className="text-slate-500 hover:text-white transition-colors p-1">
                                    <i className="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
