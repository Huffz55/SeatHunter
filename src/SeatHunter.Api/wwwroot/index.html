                return new URL(url).hostname.replace(/^www\./, '');

                return 'Web';

            // Tier & Role helpers
            const userTier = useMemo(() => (currentUser?.tier || "Free").toLowerCase(), [currentUser]);
            const isFree = userTier === "free";
            const isPro = userTier === "pro";
            const isVip = userTier === "vip";
            const isAdmin = currentUser?.isAdmin === true || currentUser?.role === "Admin";

            const formatNotifTime = (isoDate) => {
                if (!isoDate) return "";
                const d = new Date(isoDate);
                const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
                if (diffSec < 60) return lang === 'TR' ? 'Az önce' : 'Just now';
                const diffMin = Math.floor(diffSec / 60);
                if (diffMin < 60) return lang === 'TR' ? `${diffMin} dk önce` : `${diffMin}m ago`;
                const diffHr = Math.floor(diffMin / 60);
                if (diffHr < 24) return lang === 'TR' ? `${diffHr} sa önce` : `${diffHr}h ago`;
                return d.toLocaleDateString(lang === 'TR' ? 'tr-TR' : 'en-US', { day: '2-digit', month: '2-digit' }) + ' ' +
                       d.toLocaleTimeString(lang === 'TR' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit' });
            };

            const localizeNotif = (n) => {
                if (lang === 'TR' || !n) return { title: n?.title || '', message: n?.message || '' };
                const titleMap = {
                    "Tarama Başlatıldı": "Hunt Started",
                    "Tarama İptal Edildi": "Hunt Cancelled",
                    "Bilet Bulundu!": "Ticket Found!",
                    "Fiyat Düşüşü": "Price Drop"
                };
                const title = titleMap[n.title] || n.title;
                let msg = n.message || "";
                const startMatch = msg.match(/^"(.+?)" için gerçek zamanlı bilet takibi başlatıldı\.$/);
                const cancelMatch = msg.match(/^"(.+?)" için aktif bilet takibi iptal edildi\.$/);
                const foundPriceMatch = msg.match(/^(.+?) için uygun bilet bulundu \(Fiyat: (.+?) TL\)\.$/);
                const foundMatch = msg.match(/^(.+?) için uygun bilet bulundu\.$/);
                const cartMatch = msg.match(/^(.+?) için koltuk otomatik olarak sepete eklendi\.$/);
                const dropMatch = msg.match(/^(.+?) bilet fiyatı (.+?) TL seviyesine düştü\.$/);

                if (startMatch) msg = `Real-time ticket tracking started for "${startMatch[1]}".`;
                else if (cancelMatch) msg = `Active ticket tracking cancelled for "${cancelMatch[1]}".`;
                else if (foundPriceMatch) msg = `Matching seats found for ${foundPriceMatch[1]} (Price: ${foundPriceMatch[2]} TL).`;
                else if (foundMatch) msg = `Matching seats found for ${foundMatch[1]}.`;
                else if (cartMatch) msg = `Seats automatically added to cart for ${cartMatch[1]}.`;
                else if (dropMatch) msg = `Ticket price for ${dropMatch[1]} dropped to ${dropMatch[2]} TL.`;

                return { title, message: msg };
            };

            const toggleLang = () => {
                const next = lang === "TR" ? "EN" : "TR";
                setLang(next);
                localStorage.setItem('lang', next);
            };

            const showToast = (title, message, type = "info") => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, title, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            };

            const logout = () => {
                setToken(null);
                setCurrentUser(null);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setActiveHunts([]);
                setHistoryHunts([]);
                setNotifications([]);
                setUnreadCount(0);
                setAdminStats(null);
                setAdminUsers([]);
                setShowDeleteConfirm(false);
                setIsNotifDropdownOpen(false);
                setUserNav("dashboard");
                setAdminNav("overview");
            };

            // Sync profile on mount
            useEffect(() => {
                if (!token) return;
                fetch('/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.status === 401) {
                        logout();
                        return null;
                    }
                    return res.ok ? res.json() : null;
                })
                .then(data => {
                    if (data) {
                        const updated = {
                            ...(currentUser || {}),
                            userId: data.id,
                            id: data.id,
                            email: data.email,
                            firstName: data.firstName,
                            lastName: data.lastName,
                            tier: data.tier,
                            role: data.role,
                            isAdmin: data.isAdmin
                        };
                        setCurrentUser(updated);
                        localStorage.setItem('user', JSON.stringify(updated));
                        setEditFirstName(data.firstName || "");
                        setEditLastName(data.lastName || "");
                    }
                })
                .catch(e => console.warn("Profile sync error:", e));
            }, [token]);

            useEffect(() => {
                if (currentUser) {
                    setEditFirstName(currentUser.firstName || "");
                    setEditLastName(currentUser.lastName || "");
                }
            }, [currentUser?.firstName, currentUser?.lastName]);

            // Close notification dropdown on outside click
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (isNotifDropdownOpen && notifDropdownRef.current && !notifDropdownRef.current.contains(e.target)) {
                        setIsNotifDropdownOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [isNotifDropdownOpen]);

            // Data fetching helpers
            const fetchActiveHunts = async () => {
                if (!token || isAdmin) return;
                try {
                    const res = await fetch('/api/hunts/active', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setActiveHunts(data.filter(h => h.status !== "Cancelled" && h.status !== "Expired"));
                    } else if (res.status === 401) {
                        logout();
                    }
                } catch (err) {
                    console.error("Aktif aramalar alınamadı:", err);
                }
            };

            const fetchHistory = async () => {
                if (!token || isAdmin) return;
                try {
                    const res = await fetch('/api/hunts/history', { 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setHistoryHunts(data);
                    }
                } catch (e) {
                    console.error("Geçmiş alınamadı:", e);
                }
            };

            const fetchNotifications = async () => {
                if (!token || isAdmin) return;
                try {
                    const res = await fetch('/api/notifications?take=50', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setNotifications(data.items || []);
                        setUnreadCount(data.unreadCount || 0);
                    }
                } catch (e) {
                    console.error("Bildirimler alınamadı:", e);
                }
            };

            const fetchAdminStats = async () => {
                if (!token || !isAdmin) return;
                try {
                    const res = await fetch('/api/admin/dashboard/overview', { 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setAdminStats(data);
                    }
                } catch (e) {
                    console.error("Admin stats failed:", e);
                }
            };

            const fetchAdminUsers = async () => {
                if (!token || !isAdmin) return;
                setIsLoadingAdminUsers(true);
                try {
                    const res = await fetch('/api/admin/users', { 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setAdminUsers(data);
                    }
                } catch (e) {
                    console.error("Admin users fetch failed:", e);
                } finally {
                    setIsLoadingAdminUsers(false);
                }
            };

            useEffect(() => {
                if (!token) return;
                if (isAdmin) {
                    fetchAdminStats();
                    fetchAdminUsers();
                } else {
                    fetchActiveHunts();
                    fetchNotifications();
                    fetchHistory();
                }
            }, [token, isAdmin]);

            useEffect(() => {
                if (!token || isAdmin) return;
                if (userNav === "history") fetchHistory();
                if (userNav === "notifications") fetchNotifications();
                if (userNav === "hunts") fetchActiveHunts();
            }, [userNav]);

            // SignalR notifications
            useEffect(() => {
                if (!token) return;
                let isDisposed = false;

                const connection = new signalR.HubConnectionBuilder()
                    .withUrl("/notificationHub", { accessTokenFactory: () => token || "" })
                    .withAutomaticReconnect([0, 2000, 5000, 10000, 30000])
                    .build();

                connection.on("SeatFound", (data) => {
                    showToast(t('seatFound'), data.message || t('seatDetectedFallback'), "success");
                    setActiveHunts(prev => prev.map(hunt => 
                        hunt.id === data.requestId ? { ...hunt, status: "Found" } : hunt
                    ));
                    fetchNotifications();
                    fetchHistory();
                });

                const startConnection = () => {
                    connection.start()
                        .catch(err => {
                            console.warn("SignalR NotificationHub uyarısı:", err);
                            if (err && err.toString().includes("401")) logout();
                        });
                };

                startConnection();

                const handleOnline = () => {
                    if (!isDisposed && connection.state === signalR.HubConnectionState.Disconnected) {
                        startConnection();
                    }
                };

                window.addEventListener("online", handleOnline);

                let adminConnection = null;
                if (isAdmin) {
                    adminConnection = new signalR.HubConnectionBuilder()
                        .withUrl("/adminHub", { accessTokenFactory: () => token || "" })
                        .withAutomaticReconnect()
                        .build();

                    adminConnection.on("AdminSeatDiscovered", (notif) => {
                        showToast(t('liveSeatDetected'), `${notif.eventName || notif.requestId}: ${t('seatFoundShort')}`, "success");
                        setAdminLiveEvents(prev => [{
                            id: Date.now(),
                            title: t('seatCaughtTitle'),
                            detail: `${notif.eventName || notif.requestId}`,
                            time: new Date().toLocaleTimeString(lang === 'TR' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                        }, ...prev].slice(0, 15));
                        fetchAdminStats();
                    });

                    adminConnection.on("AdminDlqReplayed", (data) => {
                        showToast("DLQ Replay", `${data.replayedCount} ${t('dlqReplayedToast')}`, "info");
                        setAdminLiveEvents(prev => [{
                            id: Date.now(),
                            title: "DLQ Replay",
                            detail: `${data.replayedCount} ${t('dlqReplayedDetail')}`,
                            time: new Date().toLocaleTimeString(lang === 'TR' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                        }, ...prev].slice(0, 15));
                        fetchAdminStats();
                    });

                    adminConnection.on("AdminStatsUpdated", (stats) => {
                        setAdminStats(stats);
                    });

                    adminConnection.start().catch(err => console.warn("AdminHub uyarısı:", err));
                }

                return () => {
                    isDisposed = true;
                    window.removeEventListener("online", handleOnline);
                    connection.stop();
                    if (adminConnection) adminConnection.stop();
                };
            }, [token, isAdmin, lang]);

            // Keyboard shortcut handling silently under the hood
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "Escape") {
                        if (showDeleteConfirm) {
                            e.preventDefault();
                            setShowDeleteConfirm(false);
                            return;
                        }
                        if (isNotifDropdownOpen) {
                            e.preventDefault();
                            setIsNotifDropdownOpen(false);
                            return;
                        }
                    }

                    if (showDeleteConfirm && e.key === "Enter") {
                        e.preventDefault();
                        handleDeleteAccount();
                        return;
                    }

                    if (showDeleteConfirm) return;

                    const isCtrlOrCmdK = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k";
                    if (isCtrlOrCmdK) {
                        if (targetUrlInputRef.current) {
                            e.preventDefault();
                            targetUrlInputRef.current.focus();
                            targetUrlInputRef.current.select();
                        }
                    }
                };

                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [showDeleteConfirm, isNotifDropdownOpen]);

            // Notification handlers
            const handleMarkAsRead = async (notifId) => {
                try {
                    const res = await fetch(`/api/notifications/${notifId}/read`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setNotifications(prev => prev.map(n => n.id === notifId ? { ...n, isRead: true } : n));
                        setUnreadCount(data.unreadCount);
                    }
                } catch (e) { console.error(e); }
            };

            const handleMarkAllAsRead = async () => {
                try {
                    const res = await fetch('/api/notifications/read-all', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        setNotifications(prev => prev.map(n => ({ ...n, isRead: true })));
                        setUnreadCount(0);
                    }
                } catch (e) { console.error(e); }
            };

            const handleClearReadNotifications = async () => {
                try {
                    const res = await fetch('/api/notifications/read', {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        setNotifications(prev => prev.filter(n => !n.isRead));
                        showToast(t('success'), t('clearReadDone'), "info");
                    }
                } catch (e) { console.error(e); }
            };

            // Admin actions
            const handleUpdateUserTier = async (userId, newTier) => {
                try {
                    const res = await fetch(`/api/admin/users/${userId}/tier`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ tier: newTier })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setAdminUsers(prev => prev.map(u => u.id === userId ? { ...u, tier: newTier } : u));
                        showToast(t('planUpdatedTitle'), lang === 'TR' ? (data.message || `Kullanıcı planı ${newTier} yapıldı.`) : `User tier updated to ${newTier}.`, "success");
                        fetchAdminStats();
                    } else {
                        showToast(t('planUpdateFailedTitle'), lang === 'TR' ? (data.message || t('opFailed')) : t('opFailed'), "error");
                    }
                } catch (e) { console.error(e); }
            };

            const handleToggleUserStatus = async (userId) => {
                try {
                    const res = await fetch(`/api/admin/users/${userId}/toggle-status`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setAdminUsers(prev => prev.map(u => u.id === userId ? { ...u, isActive: data.isActive } : u));
                        showToast(t('userStatusTitle'), lang === 'TR' ? data.message : (data.isActive ? t('statusActive') : t('statusSuspended')), data.isActive ? "success" : "info");
                    } else {
                        showToast(t('error'), lang === 'TR' ? (data.message || t('opFailed')) : t('opFailed'), "error");
                    }
                } catch (e) { console.error(e); }
            };

            const handleReplayDlq = async () => {
                setIsReplayingDlq(true);
                try {
                    const res = await fetch('/api/admin/dlq/replay?maxCount=100', { 
                        method: 'POST', 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const data = await res.json();
                        showToast("DLQ Replay", lang === 'TR' ? data.message : `${data.replayedCount || ''} ${t('dlqReplayedToast')}`.trim(), "success");
                        fetchAdminStats();
                    }
                } catch (e) { console.error(e); }
                finally { setIsReplayingDlq(false); }
            };

            const handlePurgeDlq = async () => {
                try {
                    const res = await fetch('/api/admin/dlq/purge', { 
                        method: 'DELETE', 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if (res.ok) {
                        const data = await res.json();
                        showToast(t('dlqPurgedToastTitle'), lang === 'TR' ? data.message : t('dlqPurgedToastTitle'), "info");
                        fetchAdminStats();
                    }
                } catch (e) { console.error(e); }
            };

            const handlePriceLookup = async () => {
                if (!priceLookupUrl.trim()) return;
                try {
                    const res = await fetch(`/api/price-analytics/${encodeURIComponent(priceLookupUrl.trim())}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setPriceLookupResult(data);
                    } else {
                        setPriceLookupResult({ notFound: true });
                    }
                } catch (e) { console.error(e); }
            };

            // User profile & security handlers
            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                if (!editFirstName.trim() || !editLastName.trim()) return;
                setIsUpdatingProfile(true);
                try {
                    const res = await fetch('/api/user/profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ firstName: editFirstName.trim(), lastName: editLastName.trim() })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        const updatedUser = {
                            ...currentUser,
                            firstName: data.firstName,
                            lastName: data.lastName
                        };
                        setCurrentUser(updatedUser);
                        localStorage.setItem('user', JSON.stringify(updatedUser));
                        showToast(t('success'), lang === 'TR' ? (data.message || t('profileUpdatedMsg')) : t('profileUpdatedMsg'), "success");
                    } else {
                        showToast(t('error'), lang === 'TR' ? (data.message || t('opFailed')) : t('opFailed'), "error");
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setIsUpdatingProfile(false);
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/user/change-password', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast(t('success'), lang === 'TR' ? (data.message || t('passUpdatedMsg')) : t('passUpdatedMsg'), "success");
                        setOldPassword("");
                        setNewPassword("");
                    } else {
                        showToast(t('error'), lang === 'TR' ? (data.message || t('opFailed')) : t('opFailed'), "error");
                    }
                } catch (e) { console.error(e); }
            };

            const handleDeleteAccount = async () => {
                setShowDeleteConfirm(false);
                try {
                    const res = await fetch('/api/user/account', {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        showToast(t('success'), t('accDeleted'), "success");
                        setTimeout(logout, 1200);
                    } else {
                        const data = await res.json();
                        showToast(t('error'), data.message || t('opFailed'), "error");
                    }
                } catch (e) { console.error(e); }
            };

            const handleCancelHunt = async (huntId) => {
                try {
                    const res = await fetch(`/api/hunts/cancel/${huntId}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        setActiveHunts(prev => prev.filter(hunt => hunt.id !== huntId));
                        showToast(t('cancelled'), t('cancelledMsg'), "info");
                        fetchNotifications();
                        fetchHistory();
                    }
                } catch (e) { console.error("İptal hatası:", e); }
            };

            const handleSubmitHunt = async (e) => {
                e.preventDefault();
                if (!urlInput.trim() || !token) return;

                setIsSubmitting(true);
                const reqPayload = {
                    userId: currentUser?.userId || "user",
                    url: urlInput.trim(),
                    targetDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
                    language: lang.toLowerCase(),
                    targetEventName: eventNameInput.trim() || null,
                    maxPrice: (!isFree && maxPriceInput) ? parseFloat(maxPriceInput) : null,
                    preferredCategory: (!isFree && categoryInput.trim()) ? categoryInput.trim() : null,
                    autoReserveEnabled: isVip ? autoReserveInput : false
                };

                try {
                    const res = await fetch('/api/HuntRequests', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(reqPayload)
                    });

                    if (res.status === 401) {
                        showToast(t('authError'), t('noSession'), "error");
                    } else if (res.status === 429) {
                        showToast(t('rateLimit'), t('tooManyReq'), "error");
                    } else if (res.ok) {
                        const data = await res.json();
                        setActiveHunts(prev => [{
                            id: data.huntRequestId || Date.now().toString(),
                            provider: getDomainLabel(reqPayload.url),
                            eventId: reqPayload.url,
                            eventName: reqPayload.targetEventName,
                            status: "Active",
                            maxPrice: reqPayload.maxPrice,
                            preferredCategory: reqPayload.preferredCategory,
                            autoReserveEnabled: reqPayload.autoReserveEnabled,
                            startTime: new Date().toLocaleTimeString(lang === 'TR' ? 'tr-TR' : 'en-US', { hour: '2-digit', minute: '2-digit' })
                        }, ...prev]);

                        setUrlInput("");
                        setEventNameInput("");
                        setMaxPriceInput("");
                        setCategoryInput("");
                        setAutoReserveInput(false);
                        showToast(t('scanStartedTitle'), t('scanStartedMsg'), "success");
                        fetchNotifications();
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        const errorMsg = errData.message || errData.Message || errData.error || t('opFailed');
                        showToast(t('error'), errorMsg, "error");
                    }
                } catch (e) {
                    console.error("Arama başlatılamadı:", e);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                setAuthError("");
                
                const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/register";
                const payload = authMode === "login" 
                    ? { email, password } 
                    : { email, password, firstName, lastName };

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        if (authMode === "login") {
                            setToken(data.token);
                            localStorage.setItem('token', data.token);
                            setCurrentUser(data);
                            localStorage.setItem('user', JSON.stringify(data));
                            setEditFirstName(data.firstName || "");
                            setEditLastName(data.lastName || "");
                            showToast(t('loginSuccess'), t('loginSuccessMsg'), "success");
                        } else {
                            setAuthMode("login");
                            showToast(t('regSuccess'), t('regSuccessMsg'), "success");
                        }
                    } else {
                        const msg = data.message || t('loginFailed');
                        setAuthError(msg);
                        showToast(t('error'), msg, "error");
                    }
                } catch (err) {
                    setAuthError(t('connFailed'));
                    showToast(t('connError'), t('connFailed'), "error");
                }
            };

            const passwordValidations = useMemo(() => ({
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                number: /[0-9]/.test(password)
            }), [password]);

            const filteredAdminUsers = useMemo(() => {
                if (!adminUserSearch.trim()) return adminUsers;
                const query = adminUserSearch.toLowerCase();
                return adminUsers.filter(u => 
                    (u.email && u.email.toLowerCase().includes(query)) ||
                    (u.firstName && u.firstName.toLowerCase().includes(query)) ||
                    (u.lastName && u.lastName.toLowerCase().includes(query)) ||
                    (u.tier && u.tier.toLowerCase().includes(query))
                );
            }, [adminUsers, adminUserSearch]);

            const trulyActiveHunts = useMemo(() => {
                return activeHunts.filter(h => h.status === "Active" || h.status === "Found");
            }, [activeHunts]);

            const activeScanningCount = useMemo(() => {
                return activeHunts.filter(h => h.status === "Active").length;
            }, [activeHunts]);

            const filteredActiveHunts = useMemo(() => {
                if (!huntSearchQuery.trim()) return trulyActiveHunts;
                const q = huntSearchQuery.toLowerCase();
                return trulyActiveHunts.filter(h =>
                    (h.eventName && h.eventName.toLowerCase().includes(q)) ||
                    (h.eventId && h.eventId.toLowerCase().includes(q))
                );
            }, [trulyActiveHunts, huntSearchQuery]);

            const filteredHistory = useMemo(() => {
                if (historyFilter === "all") return historyHunts;
                return historyHunts.filter(h => h.status === historyFilter);
            }, [historyHunts, historyFilter]);

            // ==========================================
            // 1. GİRİŞ & KAYIT EKRANI
            // ==========================================
            if (!token) {
                return (
                    <div className="h-screen w-screen overflow-hidden relative flex flex-col justify-center items-center bg-[#070b14] px-4">
                        <div className="ambient-soft"></div>

                        <div className="absolute top-6 right-6 z-20">
                            <button

                                                                    </td>
                                                                    <td className="px-5 py-3.5 max-w-xs">
                                                                        <div className="text-xs font-semibold text-white truncate">{h.eventName || getDomainLabel(h.eventId)}</div>
                                                                        <a href={h.eventId} target="_blank" rel="noreferrer" className="text-[11px] font-mono text-slate-400 hover:text-indigo-400 truncate block mt-0.5">{h.eventId}</a>
                                                                    </td>
                                                                    {(isPro || isVip) && (
                                                                        <td className="px-4 py-3.5 whitespace-nowrap">
                                                                            <div className="flex flex-wrap gap-1.5">
                                                                                {h.maxPrice && <span className="text-[10px] bg-white/[0.04] border border-white/[0.06] px-2 py-0.5 rounded text-slate-300">{t('maxShort')}: {h.maxPrice} TL</span>}
                                                                                {h.preferredCategory && <span className="text-[10px] bg-white/[0.04] border border-white/[0.06] px-2 py-0.5 rounded text-slate-300">{h.preferredCategory}</span>}
                                                                                {h.autoReserveEnabled && <span className="text-[10px] bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-amber-300">{t('autoCartShort')}</span>}
                                                                                {!h.maxPrice && !h.preferredCategory && !h.autoReserveEnabled && <span className="text-[11px] text-slate-500">—</span>}
                                                                            </div>
                                                                        </td>
                                                                    )}
                                                                    <td className="px-4 py-3.5 whitespace-nowrap text-xs text-slate-400 font-mono">{h.startTime}</td>
                                                                    <td className="px-5 py-3.5 text-right whitespace-nowrap">
                                                                        <div className="inline-flex items-center gap-2">
                                                                            {h.status === "Found" ? (
                                                                                <a href={h.eventId} target="_blank" rel="noreferrer" className="text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md hover:bg-emerald-500 hover:text-white transition-colors">
                                                                                    {t('goTicket')}
                                                                                </a>
                                                                            ) : (
                                                                                <React.Fragment>
                                                                                    <span className="inline-flex items-center gap-1.5 text-[11px] font-medium text-indigo-300 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded">
                                                                                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                                                                                        {t('scanning')}
                                                                                    </span>
                                                                                    <button 
                                                                                        onClick={() => handleCancelHunt(h.id)} 
                                                                                        className="text-[11px] font-medium text-slate-400 hover:text-rose-400 px-2 py-1 rounded border border-white/[0.06] hover:border-rose-500/30 transition-colors">
                                                                                        {t('cancel')}
                                                                                    </button>
                                                                                </React.Fragment>
                                                                            )}
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* VIEW 3: NOTIFICATION CENTER */}
                                {userNav === "notifications" && (
                                    <div className="space-y-4 fade-enter">
                                        <div className="flex flex-wrap items-center justify-between gap-3">
                                            <div className="text-xs text-slate-400">
                                                {unreadCount > 0 ? `${unreadCount} ${t('unreadSuffix')}` : t('allNotifsRead')}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {unreadCount > 0 && (
                                                    <button 
                                                        onClick={handleMarkAllAsRead}
                                                        className="text-xs font-medium bg-indigo-600/15 hover:bg-indigo-600/25 text-indigo-300 border border-indigo-500/25 px-3 py-1.5 rounded-lg transition-colors">
                                                        <i className="fa-solid fa-check-double mr-1.5 text-[10px]"></i>
                                                        {t('markAllRead')}
                                                    </button>
                                                )}
                                                {notifications.some(n => n.isRead) && (
                                                    <button 
                                                        onClick={handleClearReadNotifications}
                                                        className="text-xs font-medium bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 border border-white/[0.06] px-3 py-1.5 rounded-lg transition-colors">
                                                        {t('clearRead')}
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="bg-[#0f172a]/70 border border-white/[0.07] rounded-xl overflow-hidden">
                                            {notifications.length === 0 ? (
                                                <div className="py-16 px-6 text-center">
                                                    <div className="w-12 h-12 mx-auto rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-center text-indigo-400 mb-3">
                                                        <i className="fa-solid fa-bell-slash text-base"></i>
                                                    </div>
                                                    <h3 className="text-sm font-semibold text-white mb-1">{t('noNotificationsTitle')}</h3>
                                                    <p className="text-xs text-slate-400">{t('noNotificationsDesc')}</p>
                                                </div>
                                            ) : (
                                                <div className="divide-y divide-white/[0.05] max-h-[calc(100vh-220px)] overflow-y-auto">
                                                    {notifications.map(n => {
                                                        const ln = localizeNotif(n);
                                                        return (
                                                            <div 
                                                                key={n.id}
                                                                onClick={() => { if (!n.isRead) handleMarkAsRead(n.id); }}
                                                                className={`px-6 py-4 flex items-start justify-between gap-4 transition-colors cursor-pointer hover:bg-white/[0.03] ${
                                                                    !n.isRead ? 'bg-indigo-500/[0.04]' : ''
                                                                }`}>
                                                                <div className="flex items-start gap-3.5 min-w-0">
                                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 mt-0.5 border ${
                                                                        n.type === 'success' 
                                                                            ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'
                                                                            : n.type === 'warning'
                                                                                ? 'bg-amber-500/10 border-amber-500/20 text-amber-400'
                                                                                : 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400'
                                                                    }`}>
                                                                        <i className={`fa-solid ${
                                                                            n.type === 'success' ? 'fa-ticket' : n.type === 'warning' ? 'fa-ban' : 'fa-satellite-dish'
                                                                        } text-xs`}></i>
                                                                    </div>
                                                                    <div className="min-w-0">
                                                                        <div className="flex items-center gap-2">
                                                                            {!n.isRead && <span className="w-2 h-2 rounded-full bg-indigo-400 shrink-0"></span>}
                                                                            <span className={`text-xs font-semibold ${!n.isRead ? 'text-white' : 'text-slate-300'}`}>{ln.title}</span>
                                                                        </div>
                                                                        <p className="text-xs text-slate-400 mt-0.5 leading-relaxed">{ln.message}</p>
                                                                        {n.relatedUrl && (
                                                                            <a 
                                                                                href={n.relatedUrl} 
                                                                                target="_blank" 
                                                                                rel="noreferrer" 
                                                                                onClick={(e) => { e.stopPropagation(); if (!n.isRead) handleMarkAsRead(n.id); }}
                                                                                className="inline-flex items-center gap-1 text-[11px] text-indigo-400 hover:text-indigo-300 mt-1.5 font-medium">
                                                                                <span>{t('goTicket')}</span>
                                                                                <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                                                            </a>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                                <div className="flex flex-col items-end gap-1.5 shrink-0">
                                                                    <span className="text-[11px] text-slate-500 font-mono">{formatNotifTime(n.createdAt)}</span>
                                                                    {!n.isRead && (
                                                                        <span className="text-[10px] text-indigo-400 font-medium">{t('markRead')}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* VIEW 4: HUNT HISTORY */}
                                {userNav === "history" && (
                                    <div className="space-y-4 fade-enter">
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => setHistoryFilter("all")} className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${historyFilter === 'all' ? 'bg-indigo-600/15 text-indigo-300 border-indigo-500/25' : 'bg-white/[0.02] text-slate-400 border-white/[0.06] hover:text-white'}`}>
                                                {t('allFilter')} ({historyHunts.length})
                                            </button>
                                            <button onClick={() => setHistoryFilter("Found")} className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${historyFilter === 'Found' ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/25' : 'bg-white/[0.02] text-slate-400 border-white/[0.06] hover:text-white'}`}>
                                                {t('found')}
                                            </button>
                                            <button onClick={() => setHistoryFilter("Cancelled")} className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ${historyFilter === 'Cancelled' ? 'bg-slate-700 text-white border-white/10' : 'bg-white/[0.02] text-slate-400 border-white/[0.06] hover:text-white'}`}>
                                                {t('cancelled')}
                                            </button>
                                        </div>

                                        <div className="bg-[#0f172a]/70 border border-white/[0.07] rounded-xl overflow-hidden">
                                            {filteredHistory.length === 0 ? (
                                                <div className="py-16 px-6 text-center">
                                                    <div className="w-12 h-12 mx-auto rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-center text-indigo-400 mb-3">
                                                        <i className="fa-solid fa-clock-rotate-left text-base"></i>
                                                    </div>
                                                    <h3 className="text-sm font-semibold text-white mb-1">{t('noHistoryTitle')}</h3>
                                                    <p className="text-xs text-slate-400">{t('noHistory')}</p>
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto max-h-[calc(100vh-220px)] overflow-y-auto">
                                                    <table className="w-full text-left border-collapse">
                                                        <thead className="sticky top-0 bg-[#0f172a] z-10 border-b border-white/[0.06]">
                                                            <tr className="text-[10px] uppercase tracking-wider text-slate-400">
                                                                <th className="px-5 py-3 font-semibold">{t('source')}</th>
                                                                <th className="px-5 py-3 font-semibold">{t('routeId')}</th>
                                                                <th className="px-4 py-3 font-semibold">{t('dateCol')}</th>
                                                                <th className="px-5 py-3 font-semibold text-right">{t('status')}</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-white/[0.04]">
                                                            {filteredHistory.map(h => (
                                                                <tr key={h.id} className="hover:bg-white/[0.02] transition-colors">
                                                                    <td className="px-5 py-3.5 whitespace-nowrap">
                                                                        <span className="text-xs font-medium text-slate-300 bg-white/[0.04] border border-white/[0.06] px-2 py-0.5 rounded">
                                                                            {getDomainLabel(h.eventId)}
                                                                        </span>
                                                                    </td>
                                                                    <td className="px-5 py-3.5 max-w-sm">
                                                                        <div className="text-xs font-semibold text-white truncate">{h.eventName || getDomainLabel(h.eventId)}</div>
                                                                        <a href={h.eventId} target="_blank" rel="noreferrer" className="text-[11px] font-mono text-slate-400 hover:text-indigo-400 truncate block mt-0.5">{h.eventId}</a>
                                                                    </td>
                                                                    <td className="px-4 py-3.5 whitespace-nowrap text-xs text-slate-400 font-mono">{h.date}</td>
                                                                    <td className="px-5 py-3.5 text-right whitespace-nowrap">
                                                                        {h.status === "Found" ? (
                                                                            <span className="text-[11px] font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/20">
                                                                                {t('found')}
                                                                            </span>
                                                                        ) : h.status === "Expired" ? (
                                                                            <span className="text-[11px] font-medium text-amber-300 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/20">
                                                                                {t('expired')}
                                                                            </span>
                                                                        ) : (
                                                                            <span className="text-[11px] font-medium text-slate-400 bg-white/[0.03] px-2.5 py-0.5 rounded border border-white/[0.05]">
                                                                                {t('cancelled')}
                                                                            </span>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* VIEW 5: ACCOUNT & SETTINGS */}
                                {userNav === "settings" && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 fade-enter">
                                        {/* Left: Profile & Plan Card */}
                                        <div className="lg:col-span-6 bg-[#0f172a]/70 border border-white/[0.07] rounded-xl p-6 space-y-5">
                                            <div className="flex items-center justify-between pb-4 border-b border-white/[0.06]">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-indigo-600/15 border border-indigo-500/25 text-indigo-300 font-bold text-sm flex items-center justify-center">
                                                        {(currentUser?.firstName || "U")[0].toUpperCase()}
                                                    </div>
                                                    <div>
                                                        <h3 className="text-sm font-semibold text-white">{currentUser?.firstName} {currentUser?.lastName}</h3>
                                                        <p className="text-[11px] text-slate-400 font-mono">{currentUser?.email}</p>
                                                    </div>
                                                </div>
                                                <span className={`text-xs font-semibold px-2.5 py-1 rounded-md border ${
                                                    isVip ? 'bg-amber-500/10 text-amber-300 border-amber-500/20' 
                                                    : isPro ? 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20' 
                                                    : 'bg-slate-800 text-slate-300 border-white/[0.08]'
                                                }`}>
                                                    {isVip ? 'VIP' : isPro ? 'Pro' : 'Free'} Plan
                                                </span>
                                            </div>

                                            <form onSubmit={handleUpdateProfile} className="space-y-3.5">
                                                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-300">{t('profileInfoTitle')}</h4>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">{t('name')}</label>
                                                        <input 
                                                            type="text" 
                                                            value={editFirstName} 
                                                            onChange={e => setEditFirstName(e.target.value)} 
                                                            required 
                                                            className="w-full bg-[#070b14]/70 border border-white/[0.08] text-slate-200 rounded-lg px-3.5 py-2 text-xs outline-none focus:border-indigo-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">{t('surname')}</label>
                                                        <input 
                                                            type="text" 
                                                            value={editLastName} 
                                                            onChange={e => setEditLastName(e.target.value)} 
                                                            required 
                                                            className="w-full bg-[#070b14]/70 border border-white/[0.08] text-slate-200 rounded-lg px-3.5 py-2 text-xs outline-none focus:border-indigo-500"
                                                        />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-medium text-slate-400 mb-1">{t('email')}</label>
                                                    <input 
                                                        type="email" 
                                                        value={currentUser?.email || ""} 
                                                        disabled 
                                                        className="w-full bg-[#070b14]/40 border border-white/[0.05] text-slate-500 rounded-lg px-3.5 py-2 text-xs cursor-not-allowed"
                                                    />
                                                </div>
                                                <button 
                                                    type="submit" 
                                                    disabled={isUpdatingProfile}
                                                    className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium rounded-lg px-4 py-2 text-xs transition-colors">
                                                    {t('updateProfile')}
                                                </button>
                                            </form>
                                        </div>

                                        {/* Right: Security & Account Deletion */}
                                        <div className="lg:col-span-6 space-y-6">
                                            <div className="bg-[#0f172a]/70 border border-white/[0.07] rounded-xl p-6">
                                                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-300 mb-4">{t('changePass')}</h4>
                                                <form onSubmit={handleChangePassword} className="space-y-3.5">
                                                    <div>
                                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">{t('currentPass')}</label>
                                                        <input 
                                                            type="password" 
                                                            value={oldPassword} 
                                                            onChange={e => setOldPassword(e.target.value)} 
                                                            required 
                                                            className="w-full bg-[#070b14]/70 border border-white/[0.08] text-slate-200 rounded-lg px-3.5 py-2 text-xs outline-none focus:border-indigo-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">{t('newPass')}</label>
                                                        <input 
                                                            type="password" 
                                                            value={newPassword} 
                                                            onChange={e => setNewPassword(e.target.value)} 
                                                            required 
                                                            className="w-full bg-[#070b14]/70 border border-white/[0.08] text-slate-200 rounded-lg px-3.5 py-2 text-xs outline-none focus:border-indigo-500"
                                                        />
                                                    </div>
                                                    <button 
                                                        type="submit" 
                                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg px-4 py-2 text-xs transition-colors">
                                                        {t('updatePass')}
                                                    </button>
                                                </form>
                                            </div>

                                            {/* Calm & Clean Delete Account Card */}
                                            <div className="bg-[#0f172a]/70 border border-white/[0.07] rounded-xl p-6">
                                                <div className="flex items-start gap-3.5">
                                                    <div className="w-9 h-9 rounded-lg bg-white/[0.03] border border-white/[0.08] flex items-center justify-center text-slate-400 shrink-0">
                                                        <i className="fa-solid fa-user-slash text-xs"></i>
                                                    </div>
                                                    <div className="flex-1">
                                                        <h4 className="text-sm font-semibold text-white mb-1">{t('deleteAccount')}</h4>
                                                        <p className="text-xs text-slate-400 leading-relaxed mb-4">
                                                            {t('deleteWarn')}
                                                        </p>
                                                        <button 
                                                            onClick={() => setShowDeleteConfirm(true)} 
                                                            className="border border-rose-500/30 hover:bg-rose-600 hover:border-rose-600 text-rose-400 hover:text-white font-medium rounded-lg px-4 py-2 text-xs transition-colors focus:outline-none">
                                                            {t('deleteConfirmBtn')}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        </main>
                    </div>

                    {/* Delete Account Confirmation Modal */}
                    {showDeleteConfirm && (
                        <div 
                            className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/75 backdrop-blur-md"
                            onClick={() => setShowDeleteConfirm(false)}
                        >
                            <div 
                                className="bg-[#0f172a] border border-white/[0.08] rounded-xl w-full max-w-sm shadow-2xl relative z-10 p-6 text-center fade-enter"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <h3 className="text-sm font-bold text-white mb-2">{t('delConfirmTitle')}</h3>
                                <p className="text-xs text-slate-400 mb-5 font-normal">{t('delConfirmMsg')}</p>
                                <div className="flex gap-2.5">
                                    <button 
                                        onClick={() => setShowDeleteConfirm(false)} 
                                        className="flex-1 py-2 rounded-lg border border-white/[0.08] text-slate-300 hover:bg-white/[0.04] transition-colors text-xs font-medium focus:outline-none">
                                        {t('cancelBtn')}
                                    </button>
                                    <button 
                                        onClick={handleDeleteAccount} 
                                        className="flex-1 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white transition-colors text-xs font-medium shadow-sm focus:outline-none">
                                        {t('yesDelete')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notifications */}
                    <div className="fixed bottom-6 right-6 z-[100] flex flex-col gap-2.5 pointer-events-none max-w-sm w-full">
                        {toasts.map(t => (
                            <div key={t.id} className="toast-slide pointer-events-auto flex items-center gap-3 bg-[#0f172a]/95 border border-white/[0.12] px-4 py-3 rounded-lg text-xs shadow-2xl backdrop-blur-xl">
                                <div className={`w-2 h-2 rounded-full shrink-0 ${t.type === 'error' ? 'bg-rose-500' : t.type === 'info' ? 'bg-indigo-400' : 'bg-emerald-400'}`}></div>
                                <div className="flex-1">
                                    <div className="font-semibold text-slate-200">{t.title}</div>
                                    <div className="text-slate-400 text-[11px] mt-0.5 font-normal">{t.message}</div>
                                </div>
                                <button onClick={() => setToasts(prev => prev.filter(x => x.id !== t.id))} className="text-slate-500 hover:text-white transition-colors p-1">
                                    <i className="fa-solid fa-xmark text-xs"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
