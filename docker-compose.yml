version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seathunter_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seathunter_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seathunter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seathunter_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seathunter_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - seathunter_network
    restart: unless-stopped

  seathunter_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seathunter_api
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "5179:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMQ=rabbitmq
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Jwt__Key=${JWT_KEY}
      - Email__From=${EMAIL_FROM}
      - Email__Password=${EMAIL_PASSWORD}
    networks:
      - seathunter_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  seathunter_network:
    driver: bridge
