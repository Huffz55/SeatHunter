name: SeatHunter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Build Frontend Bundle
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SeatHunter.slnx

    - name: Build
      run: dotnet build SeatHunter.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test SeatHunter.slnx --no-build --verbosity normal --configuration Release
